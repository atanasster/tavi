<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img">
<rect width="880" height="380" rx="12" fill="#ffffff" stroke="#d9e0dc"/>
<circle cx="22" cy="18" r="6" fill="#e5675e"/><circle cx="42" cy="18" r="6" fill="#e9a62b"/><circle cx="62" cy="18" r="6" fill="#5bbd72"/>
<text x="440" y="23" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#52605a">tavi mcp show mcp.notes</text>
<line x1="0" y1="36" x2="880" y2="36" stroke="#d9e0dc"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<text x="20" y="70.0" xml:space="preserve"><tspan fill="#132620">mcp.notes@1.0.0 (proposed), sandbox: srt</tspan></text>
<text x="20" y="89.0" xml:space="preserve"><tspan fill="#132620">  command ["node","${package}/server.mjs"]</tspan></text>
<text x="20" y="108.0" xml:space="preserve"><tspan fill="#132620">  network: none</tspan></text>
<text x="20" y="127.0" xml:space="preserve"><tspan fill="#132620">  auth none, exposure auto, messages up to 1048576 bytes, 4 calls at once</tspan></text>
<text x="20" y="146.0" xml:space="preserve"><tspan fill="#132620">  the server reaches no network</tspan></text>
<text x="20" y="165.0" xml:space="preserve"><tspan fill="#132620">  protocol: 2025 (initialize); server says it is notes-shelf 1.0.0</tspan></text>
<text x="20" y="184.0" xml:space="preserve"><tspan fill="#132620">  instructions (shown to you, never to the model):</tspan></text>
<text x="20" y="203.0" xml:space="preserve"><tspan fill="#132620">    Use list_notes to see what is on the shelf before reading a note.</tspan></text>
<text x="20" y="222.0" xml:space="preserve"><tspan fill="#132620">  schema tokens: 0 for its approved tools</tspan></text>
<text x="20" y="241.0" xml:space="preserve"><tspan fill="#132620">tools (3):</tspan></text>
<text x="20" y="260.0" xml:space="preserve"><tspan fill="#132620">  add_note → mcp.notes.add_note [pending] suggested mutating</tspan></text>
<text x="20" y="279.0" xml:space="preserve"><tspan fill="#132620">    Adds a note to the shelf, or replaces the note with that title.</tspan></text>
<text x="20" y="298.0" xml:space="preserve"><tspan fill="#132620">  list_notes → mcp.notes.list_notes [pending] suggested read-only</tspan></text>
<text x="20" y="317.0" xml:space="preserve"><tspan fill="#132620">    Lists the titles of the notes on the shelf.</tspan></text>
<text x="20" y="336.0" xml:space="preserve"><tspan fill="#132620">  read_note → mcp.notes.read_note [pending] suggested read-only</tspan></text>
<text x="20" y="355.0" xml:space="preserve"><tspan fill="#132620">    Reads one note by its title.</tspan></text>
</g>
</svg>
