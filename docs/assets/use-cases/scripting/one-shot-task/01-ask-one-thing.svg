<svg xmlns="http://www.w3.org/2000/svg" width="880" height="171" viewBox="0 0 880 171" role="img">
<rect width="880" height="171" rx="12" fill="#ffffff" stroke="#d9e0dc"/>
<circle cx="22" cy="18" r="6" fill="#e5675e"/><circle cx="42" cy="18" r="6" fill="#e9a62b"/><circle cx="62" cy="18" r="6" fill="#5bbd72"/>
<text x="440" y="23" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#52605a">tavi run</text>
<line x1="0" y1="36" x2="880" y2="36" stroke="#d9e0dc"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<text x="20" y="70.0" xml:space="preserve"><tspan fill="#132620">This chat works in its own folder. Start tavi serve with --fs-root &lt;path&gt; to let chats work in your</tspan></text>
<text x="20" y="89.0" xml:space="preserve"><tspan fill="#132620">folders.</tspan></text>
<text x="20" y="108.0" xml:space="preserve"><tspan fill="#132620">A git rebase integrates changes from one branch into another by taking the commits from your current</tspan></text>
<text x="20" y="127.0" xml:space="preserve"><tspan fill="#132620"> branch and reapplying them one by one onto the tip of the target branch. This rewrites the commit h</tspan></text>
<text x="20" y="146.0" xml:space="preserve"><tspan fill="#132620">istory to produce a clean, linear sequence of changes without creating a merge commit.</tspan></text>
</g>
</svg>
