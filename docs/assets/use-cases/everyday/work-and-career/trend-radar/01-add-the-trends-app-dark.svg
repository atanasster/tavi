<text x="608" y="23" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#9aaba3">tavi plugins show trends.radar</text>
<line x1="0" y1="36" x2="1216" y2="36" stroke="#26332e"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<text x="20" y="70.0" xml:space="preserve"><tspan fill="#e6efea">Trends (trends.radar)</tspan></text>
<text x="20" y="89.0" xml:space="preserve"><tspan fill="#e6efea">kind: external</tspan></text>
<text x="20" y="108.0" xml:space="preserve"><tspan fill="#e6efea">state: enabled, not loaded yet (restart `tavi serve` to load it)</tspan></text>
<text x="20" y="127.0" xml:space="preserve"><tspan fill="#e6efea">description: Tracks the topics you name across free public sources (Hacker</tspan></text>
<text x="20" y="146.0" xml:space="preserve"><tspan fill="#e6efea">  News, Wikipedia pageviews, GDELT news, Google Trends, Bluesky, Mastodon, arXiv</tspan></text>
<text x="20" y="165.0" xml:space="preserve"><tspan fill="#e6efea">  and public broadcasters' feeds) and, with your free keys, YouTube, Naver</tspan></text>
<text x="20" y="184.0" xml:space="preserve"><tspan fill="#e6efea">  DataLab, Reddit and Threads; tests in code whether one is spiking, and tells</tspan></text>
<text x="20" y="203.0" xml:space="preserve"><tspan fill="#e6efea">  your heartbeat. Uses no paid service, never watches a person, and never posts.</tspan></text>
<text x="20" y="222.0" xml:space="preserve"><tspan fill="#e6efea">active version: 0.1.0</tspan></text>
<text x="20" y="241.0" xml:space="preserve"><tspan fill="#e6efea">files: ~/tavi-demo/plugins/trends.radar/&lt;version&gt;</tspan></text>
<text x="20" y="260.0" xml:space="preserve"><tspan fill="#e6efea">versions:</tspan></text>
<text x="20" y="279.0" xml:space="preserve"><tspan fill="#e6efea">  0.1.0 approved        sha256 149b7d0bab22b262…        installed 2026-11-08 04:33 UTC</tspan></text>
</g>
</svg>
