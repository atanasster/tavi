<text x="20" y="70.0" xml:space="preserve"><tspan fill="#132620">Places (places.open)</tspan></text>
<text x="20" y="89.0" xml:space="preserve"><tspan fill="#132620">kind: external</tspan></text>
<text x="20" y="108.0" xml:space="preserve"><tspan fill="#132620">state: enabled, not loaded yet (restart `tavi serve` to load it)</tspan></text>
<text x="20" y="127.0" xml:space="preserve"><tspan fill="#132620">description: Finds places from open data (OpenStreetMap, and an Overture Maps area pack you choose),</tspan></text>
<text x="20" y="146.0" xml:space="preserve"><tspan fill="#132620"> resolves them across sources with each fact's source and age, and keeps them as each source's terms</tspan></text>
<text x="20" y="165.0" xml:space="preserve"><tspan fill="#132620"> allow. Never books for you.</tspan></text>
