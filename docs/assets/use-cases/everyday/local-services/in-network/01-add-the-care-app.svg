<text x="20" y="241.0" xml:space="preserve"><tspan fill="#132620">  0.1.0 approved        sha256 64c705d9be6c89b3…        installed 2026-11-06 11:24 UTC</tspan></text>
<text x="20" y="260.0" xml:space="preserve"><tspan fill="#132620">    runs as a confined worker</tspan></text>
