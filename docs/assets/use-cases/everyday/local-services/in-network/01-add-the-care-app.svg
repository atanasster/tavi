<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<text x="20" y="70.0" xml:space="preserve"><tspan fill="#132620">Places: health (places.care)</tspan></text>
<text x="20" y="89.0" xml:space="preserve"><tspan fill="#132620">kind: external</tspan></text>
<text x="20" y="108.0" xml:space="preserve"><tspan fill="#132620">state: enabled, not loaded yet (restart `tavi serve` to load it)</tspan></text>
<text x="20" y="127.0" xml:space="preserve"><tspan fill="#132620">description: Finds health providers in public registries (the NPI Registry, Medicare's Doctors and C</tspan></text>
<text x="20" y="146.0" xml:space="preserve"><tspan fill="#132620">linicians) and checks providers against a payer's published Plan-Net network. Personal: offered only</tspan></text>
<text x="20" y="165.0" xml:space="preserve"><tspan fill="#132620"> in its operator's own chats. Keeps nothing about a provider, plan or person.</tspan></text>
<text x="20" y="184.0" xml:space="preserve"><tspan fill="#132620">active version: 0.1.0</tspan></text>
<text x="20" y="203.0" xml:space="preserve"><tspan fill="#132620">files: ~/tavi-demo/plugins/places.care/&lt;version&gt;</tspan></text>
