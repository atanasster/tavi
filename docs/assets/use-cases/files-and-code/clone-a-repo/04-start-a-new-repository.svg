<text x="608" y="23" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#52605a">tavi chat</text>
<line x1="0" y1="36" x2="1216" y2="36" stroke="#d9e0dc"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<text x="20" y="70.0" xml:space="preserve"><tspan fill="#1f6b55">❯ Start a new git repository in a folder called notes.</tspan></text>
<text x="20" y="89.0" xml:space="preserve"><tspan fill="#8c5a07">◆ Earlier chats — Clone recipes git repository (task-mw7027wm-1)</tspan></text>
<text x="20" y="108.0" xml:space="preserve"><tspan fill="#8c5a07">⏸ Round 1 needs approval:</tspan></text>
<text x="20" y="127.0" xml:space="preserve"><tspan fill="#8c5a07">  • sandbox.run — Run “mkdir -p notes &amp;&amp; cd notes &amp;&amp; git init” in the sandbox [medium risk]</tspan></text>
<text x="20" y="146.0" xml:space="preserve"><tspan fill="#8c5a07">      /bin/sh -c 'mkdir -p notes &amp;&amp; cd notes &amp;&amp; git init'</tspan></text>
<text x="20" y="165.0" xml:space="preserve"><tspan fill="#8c5a07">  y approves it, s until tomorrow, a always (a workspace rule), n rejects it, N rejects with a reason — or decide it in another terminal:</tspan></text>
<text x="20" y="184.0" xml:space="preserve"><tspan fill="#8c5a07">tavi approvals approve|reject task-mw703pjw-14</tspan></text>
<text x="20" y="203.0" xml:space="preserve"><tspan fill="#8c5a07">✓ Round 1 approved by operator</tspan></text>
<text x="20" y="222.0" xml:space="preserve"><tspan fill="#132620" opacity="0.62">── resuming after approval ──</tspan></text>
<text x="20" y="241.0" xml:space="preserve"><tspan fill="#132620" opacity="0.62">⏺ sandbox.run({"command":"mkdir -p notes &amp;&amp; cd notes &amp;&amp; git init"}) ✓ 240 ms</tspan></text>
<text x="20" y="260.0" xml:space="preserve"><tspan fill="#132620" opacity="0.62">  ⎿ {"session":{"sessionId":"sandbox-run-5","state":"completed"},"exitCode"…</tspan></text>
<text x="20" y="279.0" xml:space="preserve"><tspan fill="#132620">Created the folder `notes` and initialized an empty Git repository inside it (`notes/.git/`).</tspan></text>
<text x="20" y="298.0" xml:space="preserve"><tspan fill="#132620" opacity="0.62">✓ Done. Type to continue it (/side for a side chat), or Ctrl-C to quit.</tspan></text>
<text x="20" y="317.0" xml:space="preserve"><tspan fill="#132620">❯ █</tspan></text>
