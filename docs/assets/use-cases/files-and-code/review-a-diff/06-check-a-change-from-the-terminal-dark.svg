<text x="20" y="317.0" xml:space="preserve"><tspan fill="#e6efea">```markdown</tspan></text>
<text x="20" y="336.0" xml:space="preserve"><tspan fill="#e6efea">Monday: gym</tspan></text>
<text x="20" y="355.0" xml:space="preserve"><tspan fill="#e6efea">Tuesday: yoga</tspan></text>
<text x="20" y="374.0" xml:space="preserve"><tspan fill="#e6efea">Wednesday: rest</tspan></text>
<text x="20" y="393.0" xml:space="preserve"><tspan fill="#e6efea">```</tspan></text>
<text x="20" y="412.0" xml:space="preserve"><tspan fill="#f5c75a">… type to continue Home</tspan></text>
<text x="20" y="431.0" xml:space="preserve"><tspan fill="#6fd9b4">❯ In plan.md, change Wednesday: rest to Wednesday: walk.</tspan></text>
<text x="20" y="450.0" xml:space="preserve"><tspan fill="#f5c75a">⏸ Round 6 needs approval:</tspan></text>
<text x="20" y="469.0" xml:space="preserve"><tspan fill="#f5c75a">  • fs.edit — Edit plan.md [medium risk]</tspan></text>
<text x="20" y="488.0" xml:space="preserve"><tspan fill="#f5c75a">      --- plan.md</tspan></text>
