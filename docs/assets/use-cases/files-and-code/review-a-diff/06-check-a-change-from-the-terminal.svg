<text x="20" y="393.0" xml:space="preserve"><tspan fill="#132620">```</tspan></text>
<text x="20" y="412.0" xml:space="preserve"><tspan fill="#8c5a07">… type to continue Home</tspan></text>
<text x="20" y="431.0" xml:space="preserve"><tspan fill="#1f6b55">❯ In plan.md, change Wednesday: rest to Wednesday: walk.</tspan></text>
<text x="20" y="450.0" xml:space="preserve"><tspan fill="#8c5a07">⏸ Round 6 needs approval:</tspan></text>
