<text x="482" y="23" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#9aaba3">tavi chat</text>
<line x1="0" y1="36" x2="964" y2="36" stroke="#26332e"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<text x="20" y="70.0" xml:space="preserve"><tspan fill="#6fd9b4">❯ Open http://127.0.0.1:51335/ in the browser and download the Q1 sales report.</tspan></text>
<text x="20" y="89.0" xml:space="preserve"><tspan fill="#f5c75a">⏸ Round 1 needs approval:</tspan></text>
<text x="20" y="108.0" xml:space="preserve"><tspan fill="#f5c75a">  • browser.create_session — Use the browser to open 127.0.0.1:51335 [medium risk]</tspan></text>
<text x="20" y="127.0" xml:space="preserve"><tspan fill="#f5c75a">      http://127.0.0.1:51335/</tspan></text>
<text x="20" y="146.0" xml:space="preserve"><tspan fill="#f5c75a">        “http://127.0.0.1:51335/” from your message</tspan></text>
<text x="20" y="165.0" xml:space="preserve"><tspan fill="#f5c75a">  y allows the browser on 127.0.0.1:51335 for this chat, a always (the browser on 127.0.0.1:51335, in every</tspan></text>
<text x="20" y="184.0" xml:space="preserve"><tspan fill="#f5c75a">chat), n refuses it, N refuses with a reason — or decide it in another terminal: tavi approvals approve|reject</tspan></text>
<text x="20" y="203.0" xml:space="preserve"><tspan fill="#f5c75a"> task-mw6n4fot-1</tspan></text>
<text x="20" y="222.0" xml:space="preserve"><tspan fill="#f5c75a">✓ Round 1 approved by operator</tspan></text>
<text x="20" y="241.0" xml:space="preserve"><tspan fill="#e6efea" opacity="0.62">── resuming after approval ──</tspan></text>
<text x="20" y="260.0" xml:space="preserve"><tspan fill="#e6efea" opacity="0.62">⏺ browser.create_session({"url":"http://127.0.0.1:51335/","profile":"ephemeral"}) ✓ 4.4 s</tspan></text>
<text x="20" y="279.0" xml:space="preserve"><tspan fill="#e6efea" opacity="0.62">  ⎿ {"sessionId":"browser-session-1","state":"open","page":{"sessionId":"br…</tspan></text>
<text x="20" y="298.0" xml:space="preserve"><tspan fill="#f5c75a">⏸ Round 2 needs approval:</tspan></text>
<text x="20" y="317.0" xml:space="preserve"><tspan fill="#f5c75a">  • browser.act — Browser download on “Download the Q1 sales report (CSV)” [high risk]</tspan></text>
<text x="20" y="336.0" xml:space="preserve"><tspan fill="#f5c75a">      ⚠ Why am I asked? This chat read content Tavi does not trust, and this call acts on a site as the model</tspan></text>
<text x="20" y="355.0" xml:space="preserve"><tspan fill="#f5c75a">chose: it sends, types, uploads or downloads. A page can steer the model into sending your data or fetching</tspan></text>
<text x="20" y="374.0" xml:space="preserve"><tspan fill="#f5c75a">what it wants.</tspan></text>
<text x="20" y="393.0" xml:space="preserve"><tspan fill="#f5c75a">        read: 127.0.0.1 (the page calls itself “Quarterly reports”)</tspan></text>
<text x="20" y="412.0" xml:space="preserve"><tspan fill="#f5c75a">      Flagged: downloads through the browser</tspan></text>
<text x="20" y="431.0" xml:space="preserve"><tspan fill="#f5c75a">  y approves it, n rejects it, N rejects with a reason — or decide it in another terminal: tavi approvals</tspan></text>
<text x="20" y="450.0" xml:space="preserve"><tspan fill="#f5c75a">approve|reject task-mw6n4fot-1</tspan></text>
<text x="20" y="469.0" xml:space="preserve"><tspan fill="#f5c75a">✓ Round 2 approved by operator</tspan></text>
<text x="20" y="488.0" xml:space="preserve"><tspan fill="#e6efea" opacity="0.62">── resuming after approval ──</tspan></text>
<text x="20" y="507.0" xml:space="preserve"><tspan fill="#e6efea" opacity="0.62">⏺ browser.act({"epoch":3,"kind":"download","ref":"el-1","sessionId":"browser-session-…) ✓ 373 ms</tspan></text>
<text x="20" y="526.0" xml:space="preserve"><tspan fill="#e6efea" opacity="0.62">  ⎿ {"status":"accepted","detail":"saved as artifact art-b5ce0f6b-af6f-41ba…</tspan></text>
<text x="20" y="545.0" xml:space="preserve"><tspan fill="#f5c75a">⏸ Output needs review:</tspan></text>
<text x="20" y="564.0" xml:space="preserve"><tspan fill="#f5c75a">  • art-b5ce0f6b-af6f-41ba-9f82-ac0c57faf0e5 (from browser.act)</tspan></text>
<text x="20" y="583.0" xml:space="preserve"><tspan fill="#f5c75a">  y releases all of it and resumes the chat, n rejects all of it — or decide each in another terminal: tavi</tspan></text>
<text x="20" y="602.0" xml:space="preserve"><tspan fill="#f5c75a">artifacts approve|reject &lt;artifact-id&gt;</tspan></text>
<text x="20" y="621.0" xml:space="preserve"><tspan fill="#e6efea" opacity="0.62">⏸ review: y releases the output and resumes, n rejects it</tspan></text>
<text x="20" y="640.0" xml:space="preserve"><tspan fill="#e6efea">❯ █</tspan></text>
</g>
</svg>
