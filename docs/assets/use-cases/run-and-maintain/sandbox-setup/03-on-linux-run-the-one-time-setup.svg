<svg xmlns="http://www.w3.org/2000/svg" width="880" height="627" viewBox="0 0 880 627" role="img">
<rect width="880" height="627" rx="12" fill="#ffffff" stroke="#d9e0dc"/>
<circle cx="22" cy="18" r="6" fill="#e5675e"/><circle cx="42" cy="18" r="6" fill="#e9a62b"/><circle cx="62" cy="18" r="6" fill="#5bbd72"/>
<text x="440" y="23" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#52605a">tavi sandbox --help</text>
<line x1="0" y1="36" x2="880" y2="36" stroke="#d9e0dc"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<text x="20" y="70.0" xml:space="preserve"><tspan fill="#132620">tavi sandbox &lt;action&gt; [options]</tspan></text>
<text x="20" y="89.0" xml:space="preserve"></text>
<text x="20" y="108.0" xml:space="preserve"><tspan fill="#132620">Whether shell commands (sandbox.run), local MCP servers and PDF processing can</tspan></text>
<text x="20" y="127.0" xml:space="preserve"><tspan fill="#132620">be confined on this host, and the one-time root step some Linux hosts need.</tspan></text>
<text x="20" y="146.0" xml:space="preserve"></text>
<text x="20" y="165.0" xml:space="preserve"><tspan fill="#132620">Actions:</tspan></text>
<text x="20" y="184.0" xml:space="preserve"><tspan fill="#132620">  check                      Run the live probe and print the tier, each check,</tspan></text>
<text x="20" y="203.0" xml:space="preserve"><tspan fill="#132620">                             and the cause and fix when it is unavailable</tspan></text>
<text x="20" y="222.0" xml:space="preserve"><tspan fill="#132620">  setup                      Print the root block this host needs (bubblewrap,</tspan></text>
<text x="20" y="241.0" xml:space="preserve"><tspan fill="#132620">                             socat, ripgrep; on Ubuntu a Tavi-owned bubblewrap</tspan></text>
<text x="20" y="260.0" xml:space="preserve"><tspan fill="#132620">                             under its own AppArmor profile). Nothing runs</tspan></text>
<text x="20" y="279.0" xml:space="preserve"><tspan fill="#132620">                             unless --apply</tspan></text>
<text x="20" y="298.0" xml:space="preserve"></text>
<text x="20" y="317.0" xml:space="preserve"><tspan fill="#132620">Options:</tspan></text>
<text x="20" y="336.0" xml:space="preserve"><tspan fill="#132620">  --apply                    (setup) Run the block with sudo after showing it</tspan></text>
<text x="20" y="355.0" xml:space="preserve"><tspan fill="#132620">  --remove                   (setup) Undo what setup did</tspan></text>
<text x="20" y="374.0" xml:space="preserve"><tspan fill="#132620">  --copy                     (setup) Make the bubblewrap copy even where nothing</tspan></text>
<text x="20" y="393.0" xml:space="preserve"><tspan fill="#132620">                             restricts user namespaces (an SELinux host's choice)</tspan></text>
<text x="20" y="412.0" xml:space="preserve"><tspan fill="#132620">  --refresh-hook             (setup) Also re-copy bubblewrap after every apt run</tspan></text>
<text x="20" y="431.0" xml:space="preserve"><tspan fill="#132620">  --group &lt;name&gt;             (setup) The group that may run the copy: the</tspan></text>
<text x="20" y="450.0" xml:space="preserve"><tspan fill="#132620">                             service's (default: tavi when that group exists,</tspan></text>
<text x="20" y="469.0" xml:space="preserve"><tspan fill="#132620">                             else the group of the account that ran sudo, else</tspan></text>
<text x="20" y="488.0" xml:space="preserve"><tspan fill="#132620">                             yours)</tspan></text>
<text x="20" y="507.0" xml:space="preserve"><tspan fill="#132620">  --nested                   (check) Probe srt's weaker nested mode, as</tspan></text>
<text x="20" y="526.0" xml:space="preserve"><tspan fill="#132620">                             serve --sandbox-nested runs</tspan></text>
<text x="20" y="545.0" xml:space="preserve"><tspan fill="#132620">  --format &lt;text|json&gt;       (check) Output format (default: text)</tspan></text>
<text x="20" y="564.0" xml:space="preserve"><tspan fill="#132620">  --data-dir &lt;path&gt;          (check) Data directory (default: $TAVI_DATA_DIR, else your user data di</tspan></text>
<text x="20" y="583.0" xml:space="preserve"><tspan fill="#132620">rectory)</tspan></text>
<text x="20" y="602.0" xml:space="preserve"><tspan fill="#132620">  -h, --help                 Show this help</tspan></text>
</g>
</svg>
