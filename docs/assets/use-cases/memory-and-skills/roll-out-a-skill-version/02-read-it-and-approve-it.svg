<text x="20" y="70.0" xml:space="preserve"><tspan fill="#132620">release-notes@2.0.0 (proposed) sha256 5bebe8c0f5d553165981bfbb2b3782eb17b24f3efdc7ec8cd0e841c0d82343e7</tspan></text>
<text x="20" y="89.0" xml:space="preserve"><tspan fill="#132620">provenance: team wiki</tspan></text>
<text x="20" y="108.0" xml:space="preserve"></text>
<text x="20" y="127.0" xml:space="preserve"><tspan fill="#132620">--- SKILL.md</tspan></text>
<text x="20" y="146.0" xml:space="preserve"><tspan fill="#132620"># Release notes</tspan></text>
<text x="20" y="165.0" xml:space="preserve"></text>
<text x="20" y="184.0" xml:space="preserve"><tspan fill="#132620">Start with the version and its date.</tspan></text>
<text x="20" y="203.0" xml:space="preserve"><tspan fill="#132620">Group the changes under New, Fixed and Changed, in that order; leave out an empty group.</tspan></text>
<text x="20" y="222.0" xml:space="preserve"><tspan fill="#132620">One short line per change, in words a user understands.</tspan></text>
<text x="20" y="241.0" xml:space="preserve"><tspan fill="#132620">End by thanking whoever reported a fixed bug.</tspan></text>
<text x="20" y="260.0" xml:space="preserve"></text>
<text x="20" y="279.0" xml:space="preserve"><tspan fill="#132620">release-notes@2.0.0 approved. Make it active with tavi skills activate release-notes --version 2.0.0</tspan></text>
</g>
