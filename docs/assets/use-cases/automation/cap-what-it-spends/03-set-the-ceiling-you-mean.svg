<text x="440" y="23" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#52605a">tavi schedules show</text>
<line x1="0" y1="36" x2="880" y2="36" stroke="#d9e0dc"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<text x="20" y="70.0" xml:space="preserve"><tspan fill="#132620">schedule sched-2bd89fd0-4597-4c37-add6-2c143798e381 (news-digest)</tspan></text>
<text x="20" y="89.0" xml:space="preserve"><tspan fill="#132620">  fires       every day at 07:00 (Europe/London)</tspan></text>
<text x="20" y="108.0" xml:space="preserve"><tspan fill="#132620">  state       enabled</tspan></text>
<text x="20" y="127.0" xml:space="preserve"><tspan fill="#132620">  next fire   Tue 3 Nov 07:00</tspan></text>
<text x="20" y="146.0" xml:space="preserve"><tspan fill="#132620">  last run    Tue, 03/11/2026, 05:44 (manual run: over budget: stopped after 25,283 tokens, past its</tspan></text>
<text x="20" y="165.0" xml:space="preserve"><tspan fill="#132620"> ceiling of 2,000 tokens)</tspan></text>
<text x="20" y="184.0" xml:space="preserve"><tspan fill="#132620">  failures    0 consecutive</tspan></text>
<text x="20" y="203.0" xml:space="preserve"><tspan fill="#132620">  prompt      Write a three-line digest of what a small allotment society might need to know this we</tspan></text>
<text x="20" y="222.0" xml:space="preserve"><tspan fill="#132620">ek.</tspan></text>
<text x="20" y="241.0" xml:space="preserve"><tspan fill="#132620">  missed      run-once-if-missed-within-6h</tspan></text>
<text x="20" y="260.0" xml:space="preserve"><tspan fill="#132620">  runs as     (the base instructions)</tspan></text>
<text x="20" y="279.0" xml:space="preserve"><tspan fill="#132620">  alert       none</tspan></text>
<text x="20" y="298.0" xml:space="preserve"><tspan fill="#132620">  questions   never asks</tspan></text>
<text x="20" y="317.0" xml:space="preserve"><tspan fill="#132620">  delivers    only what the run sends itself</tspan></text>
<text x="20" y="336.0" xml:space="preserve"><tspan fill="#132620">  notifies    after every run; failures always</tspan></text>
<text x="20" y="355.0" xml:space="preserve"><tspan fill="#132620">  run limit   30 minutes of work (the default), then stopped</tspan></text>
<text x="20" y="374.0" xml:space="preserve"><tspan fill="#132620">  tokens      100,000 tokens a run, its workers included, then stopped</tspan></text>
<text x="20" y="393.0" xml:space="preserve"><tspan fill="#132620">  folder      each run's own</tspan></text>
