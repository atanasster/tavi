<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<text x="20" y="70.0" xml:space="preserve"><tspan fill="#e6efea">schedule sched-54645bc4-6368-4f69-8e05-566cbdcb633f (library-hours)</tspan></text>
<text x="20" y="89.0" xml:space="preserve"><tspan fill="#e6efea">  fires       every day at 08:00 (Europe/London)</tspan></text>
<text x="20" y="108.0" xml:space="preserve"><tspan fill="#e6efea">  state       enabled</tspan></text>
<text x="20" y="127.0" xml:space="preserve"><tspan fill="#e6efea">  next fire   Sun 8 Nov 08:00</tspan></text>
<text x="20" y="146.0" xml:space="preserve"><tspan fill="#e6efea">  last run    Sat, 07/11/2026, 16:25 (manual run: completed quietly: the result was unchanged, so it</tspan></text>
<text x="20" y="165.0" xml:space="preserve"><tspan fill="#e6efea"> was not sent again)</tspan></text>
<text x="20" y="184.0" xml:space="preserve"><tspan fill="#e6efea">  failures    0 consecutive</tspan></text>
<text x="20" y="203.0" xml:space="preserve"><tspan fill="#e6efea">  prompt      Read this note: 'The library is open as usual.' If it says the library is closed, say</tspan></text>
<text x="20" y="222.0" xml:space="preserve"><tspan fill="#e6efea">so in one line. Otherwise there is nothing to tell.</tspan></text>
<text x="20" y="241.0" xml:space="preserve"><tspan fill="#e6efea">  missed      run-once-if-missed-within-6h</tspan></text>
<text x="20" y="260.0" xml:space="preserve"><tspan fill="#e6efea">  runs as     (the base instructions)</tspan></text>
<text x="20" y="279.0" xml:space="preserve"><tspan fill="#e6efea">  alert       none</tspan></text>
<text x="20" y="298.0" xml:space="preserve"><tspan fill="#e6efea">  questions   never asks</tspan></text>
<text x="20" y="317.0" xml:space="preserve"><tspan fill="#e6efea">  delivers    its result into Home, as a notice</tspan></text>
<text x="20" y="336.0" xml:space="preserve"><tspan fill="#e6efea">  notifies    only when a run has something to send; a run with nothing to tell stays quiet; failure</tspan></text>
<text x="20" y="355.0" xml:space="preserve"><tspan fill="#e6efea">s always</tspan></text>
