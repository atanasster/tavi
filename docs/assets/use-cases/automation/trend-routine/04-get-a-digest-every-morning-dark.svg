<svg xmlns="http://www.w3.org/2000/svg" width="880" height="532" viewBox="0 0 880 532" role="img">
<rect width="880" height="532" rx="12" fill="#141e1a" stroke="#26332e"/>
<circle cx="22" cy="18" r="6" fill="#e5675e"/><circle cx="42" cy="18" r="6" fill="#e9a62b"/><circle cx="62" cy="18" r="6" fill="#5bbd72"/>
<text x="440" y="23" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#9aaba3">tavi schedules show trends-digest</text>
<line x1="0" y1="36" x2="880" y2="36" stroke="#26332e"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<text x="20" y="70.0" xml:space="preserve"><tspan fill="#e6efea">schedule sched-a5cebc60-cf84-4bd6-9bf4-cafa7f23ef20 (trends-digest)</tspan></text>
<text x="20" y="89.0" xml:space="preserve"><tspan fill="#e6efea">  fires       every day at 08:00 (Europe/London)</tspan></text>
<text x="20" y="108.0" xml:space="preserve"><tspan fill="#e6efea">  state       enabled</tspan></text>
<text x="20" y="127.0" xml:space="preserve"><tspan fill="#e6efea">  next fire   Sun 8 Nov 08:00</tspan></text>
<text x="20" y="146.0" xml:space="preserve"><tspan fill="#e6efea">  last run    never</tspan></text>
<text x="20" y="165.0" xml:space="preserve"><tspan fill="#e6efea">  failures    0 consecutive</tspan></text>
<text x="20" y="184.0" xml:space="preserve"><tspan fill="#e6efea">  prompt      Sweep my trend topics and give me a short digest of what moved.</tspan></text>
<text x="20" y="203.0" xml:space="preserve"><tspan fill="#e6efea">  missed      run-once-if-missed-within-6h</tspan></text>
<text x="20" y="222.0" xml:space="preserve"><tspan fill="#e6efea">  runs as     (the base instructions)</tspan></text>
<text x="20" y="241.0" xml:space="preserve"><tspan fill="#e6efea">  alert       none</tspan></text>
<text x="20" y="260.0" xml:space="preserve"><tspan fill="#e6efea">  questions   never asks</tspan></text>
<text x="20" y="279.0" xml:space="preserve"><tspan fill="#e6efea">  delivers    its result into Home, as a notice</tspan></text>
<text x="20" y="298.0" xml:space="preserve"><tspan fill="#e6efea">  notifies    after every run; failures always</tspan></text>
<text x="20" y="317.0" xml:space="preserve"><tspan fill="#e6efea">  run limit   30 minutes of work (the default), then stopped</tspan></text>
<text x="20" y="336.0" xml:space="preserve"><tspan fill="#e6efea">  tokens      no ceiling</tspan></text>
<text x="20" y="355.0" xml:space="preserve"><tspan fill="#e6efea">  folder      each run's own</tspan></text>
<text x="20" y="374.0" xml:space="preserve"><tspan fill="#e6efea">  pre-check   none: every fire runs</tspan></text>
<text x="20" y="393.0" xml:space="preserve"><tspan fill="#e6efea">  email       off</tspan></text>
<text x="20" y="412.0" xml:space="preserve"><tspan fill="#e6efea">  webhook     off</tspan></text>
<text x="20" y="431.0" xml:space="preserve"><tspan fill="#e6efea">  may call unattended:</tspan></text>
<text x="20" y="450.0" xml:space="preserve"><tspan fill="#e6efea">    trends.radar.sweep</tspan></text>
<text x="20" y="469.0" xml:space="preserve"><tspan fill="#e6efea">    trends.radar.velocity</tspan></text>
<text x="20" y="488.0" xml:space="preserve"><tspan fill="#e6efea">    trends.radar.cluster</tspan></text>
<text x="20" y="507.0" xml:space="preserve"><tspan fill="#e6efea">    trends.radar.brief</tspan></text>
</g>
</svg>
