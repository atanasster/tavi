<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<text x="20" y="70.0" xml:space="preserve"><tspan fill="#e6efea">Trends (trends.radar)</tspan></text>
<text x="20" y="89.0" xml:space="preserve"><tspan fill="#e6efea">kind: external</tspan></text>
<text x="20" y="108.0" xml:space="preserve"><tspan fill="#e6efea">state: enabled, not loaded yet (restart `tavi serve` to load it)</tspan></text>
<text x="20" y="127.0" xml:space="preserve"><tspan fill="#e6efea">description: Tracks the topics you name across free public sources (Hacker News, Wikipedia pageviews</tspan></text>
<text x="20" y="146.0" xml:space="preserve"><tspan fill="#e6efea">, GDELT news, Google Trends, Bluesky, Mastodon, arXiv and public broadcasters' feeds) and, with your</tspan></text>
<text x="20" y="165.0" xml:space="preserve"><tspan fill="#e6efea"> free keys, YouTube, Naver DataLab, Reddit and Threads; tests in code whether one is spiking, and te</tspan></text>
<text x="20" y="184.0" xml:space="preserve"><tspan fill="#e6efea">lls your heartbeat. Uses no paid service, never watches a person, and never posts.</tspan></text>
<text x="20" y="203.0" xml:space="preserve"><tspan fill="#e6efea">active version: 0.1.0</tspan></text>
<text x="20" y="222.0" xml:space="preserve"><tspan fill="#e6efea">files: ~/tavi-demo/plugins/trends.radar/&lt;version&gt;</tspan></text>
<text x="20" y="241.0" xml:space="preserve"><tspan fill="#e6efea">versions:</tspan></text>
<text x="20" y="260.0" xml:space="preserve"><tspan fill="#e6efea">  0.1.0 approved        sha256 7e413440f3adfd8c…        installed 2026-11-07 21:42 UTC</tspan></text>
<text x="20" y="279.0" xml:space="preserve"><tspan fill="#e6efea">    runs as a confined worker</tspan></text>
