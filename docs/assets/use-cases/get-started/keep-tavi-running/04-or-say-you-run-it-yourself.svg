<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="399" viewBox="0 0 1048 399" role="img">
<rect width="1048" height="399" rx="12" fill="#ffffff" stroke="#d9e0dc"/>
<circle cx="22" cy="18" r="6" fill="#e5675e"/><circle cx="42" cy="18" r="6" fill="#e9a62b"/><circle cx="62" cy="18" r="6" fill="#5bbd72"/>
<text x="524" y="23" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#52605a">tavi setup service</text>
<line x1="0" y1="36" x2="1048" y2="36" stroke="#d9e0dc"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<text x="20" y="70.0" xml:space="preserve"><tspan fill="#132620">Setup</tspan></text>
<text x="20" y="89.0" xml:space="preserve"><tspan fill="#132620" font-weight="700">Channels, reminders and schedules work only while tavi serve runs. Keep it running?</tspan></text>
<text x="20" y="108.0" xml:space="preserve"><tspan fill="#132620">  1. Start Tavi with my computer</tspan><tspan fill="#132620" opacity="0.62"> — a unit not written by this setup is at</tspan></text>
<text x="20" y="127.0" xml:space="preserve"><tspan fill="#132620" opacity="0.62">~/Library/LaunchAgents/dev.tavi.serve.plist; it is kept</tspan></text>
<text x="20" y="146.0" xml:space="preserve"><tspan fill="#1f6b55">❯ 2. I run it myself</tspan><tspan fill="#1f6b55" opacity="0.62"> — a terminal, tmux, my own unit</tspan></text>
<text x="20" y="165.0" xml:space="preserve"><tspan fill="#132620">  3. Not now</tspan></text>
<text x="20" y="184.0" xml:space="preserve"><tspan fill="#132620">✓ You run it yourself</tspan></text>
<text x="20" y="203.0" xml:space="preserve"></text>
<text x="20" y="222.0" xml:space="preserve"><tspan fill="#132620">✓ Choose the model Tavi thinks with — OpenRouter · google/gemini-3.8-flash · verified</tspan></text>
<text x="20" y="241.0" xml:space="preserve"><tspan fill="#132620">○ About you — Your name and time zone</tspan></text>
<text x="20" y="260.0" xml:space="preserve"><tspan fill="#132620">– Connect an app — No app can be connected here</tspan></text>
<text x="20" y="279.0" xml:space="preserve"><tspan fill="#132620">○ Where do you keep tasks? — Tavi's own list, or a task app you use</tspan></text>
<text x="20" y="298.0" xml:space="preserve"><tspan fill="#132620">○ Message Tavi from your phone — No channel is connected</tspan></text>
<text x="20" y="317.0" xml:space="preserve"><tspan fill="#132620">○ Web search — Web search is not set up</tspan></text>
<text x="20" y="336.0" xml:space="preserve"><tspan fill="#132620">  in tavi ui, or now with: tavi search add &lt;id&gt; --kind &lt;kind&gt;</tspan></text>
<text x="20" y="355.0" xml:space="preserve"><tspan fill="#132620">✓ Keep Tavi running — You run it yourself</tspan></text>
<text x="20" y="374.0" xml:space="preserve"><tspan fill="#132620">○ Try something — Try a first idea</tspan></text>
</g>
</svg>
