<svg xmlns="http://www.w3.org/2000/svg" width="964" height="380" viewBox="0 0 964 380" role="img">
<rect width="964" height="380" rx="12" fill="#ffffff" stroke="#d9e0dc"/>
<circle cx="22" cy="18" r="6" fill="#e5675e"/><circle cx="42" cy="18" r="6" fill="#e9a62b"/><circle cx="62" cy="18" r="6" fill="#5bbd72"/>
<text x="482" y="23" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#52605a">tavi service unit</text>
<line x1="0" y1="36" x2="964" y2="36" stroke="#d9e0dc"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<text x="20" y="70.0" xml:space="preserve"><tspan fill="#132620">&lt;?xml version="1.0" encoding="UTF-8"?&gt;</tspan></text>
<text x="20" y="89.0" xml:space="preserve"><tspan fill="#132620">&lt;!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"&gt;</tspan></text>
<text x="20" y="108.0" xml:space="preserve"><tspan fill="#132620">&lt;!-- Generated by `tavi service unit`. Review before installing, then:</tspan></text>
<text x="20" y="127.0" xml:space="preserve"><tspan fill="#132620">     cp dev.tavi.serve.plist ~/Library/LaunchAgents/dev.tavi.serve.plist</tspan></text>
<text x="20" y="146.0" xml:space="preserve"><tspan fill="#132620">     launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/dev.tavi.serve.plist</tspan></text>
<text x="20" y="165.0" xml:space="preserve"><tspan fill="#132620">     # ...and to remove it: launchctl bootout gui/$(id -u)/dev.tavi.serve</tspan></text>
<text x="20" y="184.0" xml:space="preserve"></text>
<text x="20" y="203.0" xml:space="preserve"><tspan fill="#132620">     Put it in ~/Library/LaunchAgents, not ~/Library/LaunchDaemons: launchd</tspan></text>
<text x="20" y="222.0" xml:space="preserve"><tspan fill="#132620">     never loads a file from the second one, and nothing says so. It starts</tspan></text>
<text x="20" y="241.0" xml:space="preserve"><tspan fill="#132620">     Tavi when you log in; for a computer that restarts with nobody logged</tspan></text>
<text x="20" y="260.0" xml:space="preserve"><tspan fill="#132620">     in, install it as a LaunchDaemon in /Library/LaunchDaemons (as root)</tspan></text>
<text x="20" y="279.0" xml:space="preserve"><tspan fill="#132620">     and bootstrap it into system/ instead. --&gt;</tspan></text>
<text x="20" y="298.0" xml:space="preserve"><tspan fill="#132620">&lt;plist version="1.0"&gt;</tspan></text>
<text x="20" y="317.0" xml:space="preserve"><tspan fill="#132620">&lt;dict&gt;</tspan></text>
<text x="20" y="336.0" xml:space="preserve"><tspan fill="#132620">  &lt;key&gt;Label&lt;/key&gt;</tspan></text>
<text x="20" y="355.0" xml:space="preserve"><tspan fill="#132620">  &lt;string&gt;dev.tavi.serve&lt;/string&gt;</tspan></text>
</g>
</svg>
