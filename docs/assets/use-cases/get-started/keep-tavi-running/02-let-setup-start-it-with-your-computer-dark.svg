<text x="524" y="23" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#9aaba3">tavi setup service</text>
<line x1="0" y1="36" x2="1048" y2="36" stroke="#26332e"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<text x="20" y="70.0" xml:space="preserve"><tspan fill="#e6efea">Setup</tspan></text>
<text x="20" y="89.0" xml:space="preserve"><tspan fill="#e6efea" font-weight="700">Channels, reminders and schedules work only while tavi serve runs. Keep it running?</tspan></text>
<text x="20" y="108.0" xml:space="preserve"><tspan fill="#6fd9b4">❯ 1. Start Tavi with my computer</tspan><tspan fill="#6fd9b4" opacity="0.62"> — a unit not written by this setup is at</tspan></text>
<text x="20" y="127.0" xml:space="preserve"><tspan fill="#6fd9b4" opacity="0.62">~/Library/LaunchAgents/dev.tavi.serve.plist; it is kept</tspan></text>
<text x="20" y="146.0" xml:space="preserve"><tspan fill="#e6efea">  2. I run it myself</tspan><tspan fill="#e6efea" opacity="0.62"> — a terminal, tmux, my own unit</tspan></text>
<text x="20" y="165.0" xml:space="preserve"><tspan fill="#e6efea">  3. Not now</tspan></text>
</g>
