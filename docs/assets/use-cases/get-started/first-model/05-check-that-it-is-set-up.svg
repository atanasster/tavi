<text x="20" y="89.0" xml:space="preserve"><tspan fill="#132620">✓ Choose the model Tavi thinks with — OpenRouter · google/gemini-3.8-flash · verified</tspan></text>
<text x="20" y="108.0" xml:space="preserve"><tspan fill="#132620">○ About you — Your name and time zone</tspan></text>
