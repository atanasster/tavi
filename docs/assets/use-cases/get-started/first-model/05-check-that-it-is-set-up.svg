<text x="20" y="165.0" xml:space="preserve"><tspan fill="#132620">○ Message Tavi from your phone — No channel is connected</tspan></text>
<text x="20" y="184.0" xml:space="preserve"><tspan fill="#132620">○ Web search — Web search is not set up</tspan></text>
<text x="20" y="203.0" xml:space="preserve"><tspan fill="#132620">  in tavi ui, or now with: tavi search add &lt;id&gt; --kind &lt;kind&gt;</tspan></text>
