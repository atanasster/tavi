<svg xmlns="http://www.w3.org/2000/svg" width="964" height="304" viewBox="0 0 964 304" role="img">
<rect width="964" height="304" rx="12" fill="#141e1a" stroke="#26332e"/>
<circle cx="22" cy="18" r="6" fill="#e5675e"/><circle cx="42" cy="18" r="6" fill="#e9a62b"/><circle cx="62" cy="18" r="6" fill="#5bbd72"/>
<text x="482" y="23" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#9aaba3">tavi onboard</text>
<line x1="0" y1="36" x2="964" y2="36" stroke="#26332e"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<text x="20" y="70.0" xml:space="preserve"><tspan fill="#e6efea">Welcome to Tavi</tspan></text>
<text x="20" y="89.0" xml:space="preserve"></text>
<text x="20" y="108.0" xml:space="preserve"><tspan fill="#e6efea">Tavi needs one model to answer you.</tspan></text>
<text x="20" y="127.0" xml:space="preserve"><tspan fill="#e6efea" font-weight="700">Which model provider?</tspan></text>
<text x="20" y="146.0" xml:space="preserve"><tspan fill="#e6efea">  1. OpenRouter (recommended)</tspan><tspan fill="#e6efea" opacity="0.62"> — billed per use with your key</tspan></text>
<text x="20" y="165.0" xml:space="preserve"><tspan fill="#e6efea">  2. Ollama</tspan><tspan fill="#e6efea" opacity="0.62"> — runs on this computer, no key</tspan></text>
<text x="20" y="184.0" xml:space="preserve"><tspan fill="#6fd9b4">❯ 3. Anthropic</tspan><tspan fill="#6fd9b4" opacity="0.62"> — billed per use with your key</tspan></text>
<text x="20" y="203.0" xml:space="preserve"><tspan fill="#e6efea">  4. OpenAI</tspan><tspan fill="#e6efea" opacity="0.62"> — billed per use with your key</tspan></text>
<text x="20" y="222.0" xml:space="preserve"><tspan fill="#e6efea">  5. Another provider…</tspan></text>
<text x="20" y="241.0" xml:space="preserve"><tspan fill="#e6efea">Create a key at https://platform.claude.com/settings/keys if you have none. It is stored in Tavi's credentials</tspan></text>
<text x="20" y="260.0" xml:space="preserve"><tspan fill="#e6efea"> file (0600), never shown again.</tspan></text>
<text x="20" y="279.0" xml:space="preserve"><tspan fill="#e6efea" font-weight="700">Anthropic key (hidden)</tspan><tspan fill="#e6efea">: █</tspan></text>
</g>
</svg>
