<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<text x="20" y="70.0" xml:space="preserve"><tspan fill="#e6efea">Setup: 1 of 7 done</tspan></text>
<text x="20" y="89.0" xml:space="preserve"><tspan fill="#e6efea">✓ Choose the model Tavi thinks with — OpenRouter · google/gemini-3.8-flash · verified</tspan></text>
<text x="20" y="108.0" xml:space="preserve"><tspan fill="#e6efea">○ About you — Your name and time zone</tspan></text>
<text x="20" y="127.0" xml:space="preserve"><tspan fill="#e6efea">– Connect an app — No app can be connected here</tspan></text>
<text x="20" y="146.0" xml:space="preserve"><tspan fill="#e6efea">○ Where do you keep tasks? — Tavi's own list, or a task app you use</tspan></text>
<text x="20" y="165.0" xml:space="preserve"><tspan fill="#e6efea">○ Message Tavi from your phone — No channel is connected</tspan></text>
<text x="20" y="184.0" xml:space="preserve"><tspan fill="#e6efea">○ Web search — Web search is not set up</tspan></text>
<text x="20" y="203.0" xml:space="preserve"><tspan fill="#e6efea">  in tavi ui, or now with: tavi search add &lt;id&gt; --kind &lt;kind&gt;</tspan></text>
<text x="20" y="222.0" xml:space="preserve"><tspan fill="#e6efea">○ Keep Tavi running — Channels and schedules stop when tavi serve stops</tspan></text>
<text x="20" y="241.0" xml:space="preserve"><tspan fill="#e6efea">○ Try something — Try a first idea</tspan></text>
