<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img">
<rect width="880" height="380" rx="12" fill="#ffffff" stroke="#d9e0dc"/>
<circle cx="22" cy="18" r="6" fill="#e5675e"/><circle cx="42" cy="18" r="6" fill="#e9a62b"/><circle cx="62" cy="18" r="6" fill="#5bbd72"/>
<text x="440" y="23" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#52605a">tavi chat</text>
<line x1="0" y1="36" x2="880" y2="36" stroke="#d9e0dc"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<text x="20" y="70.0" xml:space="preserve"><tspan fill="#1f6b55">❯ In one sentence, what can you help me with?</tspan></text>
<text x="20" y="89.0" xml:space="preserve"><tspan fill="#132620">I can help you browse the web, search for flights, analyze documents and media, manage reminders and</tspan></text>
<text x="20" y="108.0" xml:space="preserve"><tspan fill="#132620"> to-dos, run code, edit local files, and automate multi-step tasks.</tspan></text>
<text x="20" y="127.0" xml:space="preserve"><tspan fill="#8c5a07">… type to continue Home</tspan></text>
<text x="20" y="146.0" xml:space="preserve"><tspan fill="#132620">─ commands ─</tspan></text>
<text x="20" y="165.0" xml:space="preserve"><tspan fill="#132620">  /needs        everything waiting on you: questions with their options, approvals, reviews</tspan></text>
<text x="20" y="184.0" xml:space="preserve"><tspan fill="#132620">  /agents       the workspace's agents, and the mailbox of the chat followed here</tspan></text>
<text x="20" y="203.0" xml:space="preserve"><tspan fill="#132620">  /schedules    the workspace's schedules: next and last fire</tspan></text>
<text x="20" y="222.0" xml:space="preserve"><tspan fill="#132620">  /approvals    the workspace's pending approval rounds, and where to decide each</tspan></text>
<text x="20" y="241.0" xml:space="preserve"><tspan fill="#132620">  /credentials  the credential references the owner stores</tspan></text>
<text x="20" y="260.0" xml:space="preserve"><tspan fill="#132620">  /models       model connections, the default and role bindings</tspan></text>
<text x="20" y="279.0" xml:space="preserve"><tspan fill="#132620">  /plugins      built-in and installed plugins, their state and what awaits review</tspan></text>
<text x="20" y="298.0" xml:space="preserve"><tspan fill="#132620">  /credentials set [reference] store a credential; its value is typed hidden</tspan></text>
<text x="20" y="317.0" xml:space="preserve"><tspan fill="#132620">  /models add [id] [base-url] [credential] [model] add a connection</tspan></text>
<text x="20" y="336.0" xml:space="preserve"><tspan fill="#132620">  /models set-default [connection] [model] the workspace's default model</tspan></text>
<text x="20" y="355.0" xml:space="preserve"><tspan fill="#132620">  /models set-role [role] [connection] [model] bind a role</tspan></text>
</g>
</svg>
