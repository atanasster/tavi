<svg xmlns="http://www.w3.org/2000/svg" width="880" height="209" viewBox="0 0 880 209" role="img">
<rect width="880" height="209" rx="12" fill="#ffffff" stroke="#d9e0dc"/>
<circle cx="22" cy="18" r="6" fill="#e5675e"/><circle cx="42" cy="18" r="6" fill="#e9a62b"/><circle cx="62" cy="18" r="6" fill="#5bbd72"/>
<text x="440" y="23" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#52605a">tavi chat --private</text>
<line x1="0" y1="36" x2="880" y2="36" stroke="#d9e0dc"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<text x="20" y="70.0" xml:space="preserve"><tspan fill="#1f6b55">❯ Suggest one small gift for a friend who loves hiking, in one line.</tspan></text>
<text x="20" y="89.0" xml:space="preserve"><tspan fill="#8c5a07">… This chat works in its own folder. Start tavi serve with --fs-root &lt;path&gt; to let chats work in</tspan></text>
<text x="20" y="108.0" xml:space="preserve"><tspan fill="#8c5a07">your folders.</tspan></text>
<text x="20" y="127.0" xml:space="preserve"><tspan fill="#132620">A compact, rechargeable headlamp (such as a Petzl or Black Diamond) makes a practical, pocket-sized</tspan></text>
<text x="20" y="146.0" xml:space="preserve"><tspan fill="#132620">gift any hiker can use.</tspan></text>
<text x="20" y="165.0" xml:space="preserve"><tspan fill="#132620" opacity="0.62">✓ Done. Type to continue it (/side for a side chat), or Ctrl-C to quit. · private</tspan></text>
<text x="20" y="184.0" xml:space="preserve"><tspan fill="#132620">❯ █</tspan></text>
</g>
</svg>
