<text x="20" y="70.0" xml:space="preserve"><tspan fill="#6fd9b4">❯ What is a pastel de nata? One sentence.</tspan></text>
<text x="20" y="89.0" xml:space="preserve"><tspan fill="#e6efea">A pastel de nata is a traditional Portuguese egg custard tart featuring a rich, caramelized custard</tspan></text>
<text x="20" y="108.0" xml:space="preserve"><tspan fill="#e6efea">filling encased in a crisp, flaky puff pastry crust.</tspan></text>
<text x="20" y="127.0" xml:space="preserve"><tspan fill="#6fd9b4">❯ We're thinking of a long weekend in Lisbon. In one sentence, what is it best known for?</tspan></text>
<text x="20" y="146.0" xml:space="preserve"><tspan fill="#e6efea">Lisbon is best known for its steep, scenic hills traversed by historic yellow trams, vibrant tiled</tspan></text>
<text x="20" y="165.0" xml:space="preserve"><tspan fill="#e6efea">architecture, historic waterfront monuments in Belém, and rich cultural traditions of pastel de nata</tspan></text>
<text x="20" y="184.0" xml:space="preserve"><tspan fill="#e6efea"> and soulful Fado music.</tspan></text>
<text x="20" y="203.0" xml:space="preserve"><tspan fill="#f5c75a">◆ Side chat task-mw6mgc21-6 finished — Completed — Compared Baixa/Chiado and Saldanha in two</tspan></text>
