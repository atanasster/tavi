<text x="20" y="70.0" xml:space="preserve"><tspan fill="#132620">─ needs you (workspace default) ─</tspan></text>
<text x="20" y="89.0" xml:space="preserve"><tspan fill="#132620">  ? task task-mw02ykfi-1: What type of food would you like for dinner this Saturday? — due in 29m</tspan></text>
<text x="20" y="108.0" xml:space="preserve"><tspan fill="#132620">    1. Italian  2. Thai  3. Mexican</tspan></text>
<text x="20" y="127.0" xml:space="preserve"><tspan fill="#132620">    `tavi answer task-mw02ykfi-1 &lt;answer&gt;`</tspan></text>
<text x="20" y="146.0" xml:space="preserve"><tspan fill="#132620">  ? task task-mw02yqsc-5: What is your budget for your sister's gift? — due in 29m</tspan></text>
<text x="20" y="165.0" xml:space="preserve"><tspan fill="#132620">    1. Under £20  2. £20 to £50  3. Over £50</tspan></text>
<text x="20" y="184.0" xml:space="preserve"><tspan fill="#132620">    `tavi answer task-mw02yqsc-5 &lt;answer&gt;`</tspan></text>
<text x="20" y="203.0" xml:space="preserve"><tspan fill="#132620">  ! task task-mw02yysk-9: fs.write notes.txt</tspan></text>
<text x="20" y="222.0" xml:space="preserve"><tspan fill="#132620">    `tavi approvals approve|reject task-mw02yysk-9`</tspan></text>
<text x="20" y="241.0" xml:space="preserve"><tspan fill="#132620" opacity="0.62">Type a message for Home and press Enter; /help lists the commands. Ctrl-C quits.</tspan></text>
