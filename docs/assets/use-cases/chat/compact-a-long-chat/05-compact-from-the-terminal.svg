<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<text x="20" y="70.0" xml:space="preserve"><tspan fill="#1f6b55">❯ Give one tip for growing basil indoors, in one sentence.</tspan></text>
<text x="20" y="89.0" xml:space="preserve"><tspan fill="#132620">Place your basil on a south-facing windowsill where it receives at least six hours of direct</tspan></text>
<text x="20" y="108.0" xml:space="preserve"><tspan fill="#132620">sunlight daily, and water at the base whenever the top inch of soil feels dry.</tspan></text>
<text x="20" y="127.0" xml:space="preserve"><tspan fill="#1f6b55">❯ And one tip for growing mint, in one sentence.</tspan></text>
<text x="20" y="146.0" xml:space="preserve"><tspan fill="#132620">Plant mint in its own dedicated container to keep its aggressive roots from overtaking other plants,</tspan></text>
<text x="20" y="165.0" xml:space="preserve"><tspan fill="#132620"> and keep the soil consistently moist in bright, indirect light.</tspan></text>
<text x="20" y="184.0" xml:space="preserve"><tspan fill="#8c5a07">◆ Epoch 1 began — 4 earlier message(s) were summarized and archived as</tspan></text>
<text x="20" y="203.0" xml:space="preserve"><tspan fill="#8c5a07">art-40e85307-ccb9-45d9-b9b3-2c7091047cfc.</tspan></text>
<text x="20" y="222.0" xml:space="preserve"><tspan fill="#1f6b55">❯ Which herb did we talk about first? One word.</tspan></text>
<text x="20" y="241.0" xml:space="preserve"><tspan fill="#132620">Basil</tspan></text>
<text x="20" y="260.0" xml:space="preserve"><tspan fill="#8c5a07">… type to continue Home</tspan></text>
<text x="20" y="279.0" xml:space="preserve"><tspan fill="#8c5a07">… fresh context: your next message starts a new epoch; earlier turns are summarized and archived</tspan></text>
<text x="20" y="298.0" xml:space="preserve"><tspan fill="#1f6b55">❯ Name one herb we did not mention. One word.</tspan></text>
<text x="20" y="317.0" xml:space="preserve"><tspan fill="#8c5a07">◆ Epoch 2 began — 3 earlier message(s) were summarized and archived as</tspan></text>
<text x="20" y="336.0" xml:space="preserve"><tspan fill="#8c5a07">art-02ead5f5-d56e-4bda-b1a5-9ff999d8a130.</tspan></text>
<text x="20" y="355.0" xml:space="preserve"><tspan fill="#132620">Rosemary</tspan></text>
<text x="20" y="374.0" xml:space="preserve"><tspan fill="#132620" opacity="0.62">✓ Done. Type to continue it (/side for a side chat), or Ctrl-C to quit.</tspan></text>
