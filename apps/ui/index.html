  <body>
    <!-- The page's one announcement region. It is here, not in the
         bundle's JSX, so it is in the accessibility tree before the bundle
         runs: a live region inserted together with its first message is
         commonly missed, and the first message is the one that matters. -->
    <p id="announcer" class="visually-hidden" role="status" aria-live="polite"></p>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
