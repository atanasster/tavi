# The sandbox matrix: Docker, Lima VMs, macOS runners and WSL2 on Windows that prove
# sandbox.run and the confined children on each host shape. Heavy, so it runs on demand (Actions → sandbox → Run
# workflow), weekly (for drift in the runners' images), on a pull request labelled `sandbox-matrix`, and on any
# pull request that changes the @anthropic-ai/sandbox-runtime pin (a Dependabot bump included) — not on every push.
# scripts/sandbox-matrix.sh runs the same jobs locally, but for `wsl2`, which needs a Windows runner.
name: sandbox

on:
  workflow_dispatch:
  schedule:
    # Tuesdays 04:00 UTC.
    - cron: "0 4 * * 2"
  pull_request:
    types: [opened, labeled, synchronize, reopened]

# A newer push to the same pull request replaces a matrix still running. A run whose jobs will
# skip (another label added) takes a group of its own, so it cannot cancel a matrix in progress;
# the condition is the jobs' `if` below.
concurrency:
  group: sandbox-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || (contains(github.event.pull_request.labels.*.name, 'sandbox-matrix') && (github.event.action != 'labeled' || github.event.label.name == 'sandbox-matrix'))) && 'matrix' || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pin:
    # Whether a pull request changes the @anthropic-ai/sandbox-runtime pin (the catalog or the lockfile): the
    # security boundary's own dependency, so its bump runs the whole matrix without waiting for the label.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff "$BASE...$HEAD" -- pnpm-workspace.yaml pnpm-lock.yaml | grep -E '^[-+].*@anthropic-ai/sandbox-runtime' > /dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  linux:
    # On demand, weekly, on a pull request that changes the sandbox runtime's pin, or on one labelled sandbox-matrix;
    # adding another label does not re-run it.
    needs: pin
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (needs.pin.outputs.changed == 'true' && github.event.action != 'labeled') || (contains(github.event.pull_request.labels.*.name, 'sandbox-matrix') && (github.event.action != 'labeled' || github.event.label.name == 'sandbox-matrix'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - { job: typecheck, runner: ubuntu-24.04 }
          - { job: docker-default, runner: ubuntu-24.04 }
          - { job: docker-nested, runner: ubuntu-24.04 }
          - { job: docker-unconfined, runner: ubuntu-24.04 }
          - { job: docker-cgroup, runner: ubuntu-24.04 }
          - { job: arm64, runner: ubuntu-24.04-arm }
          - { job: ubuntu-24.04-restricted, runner: ubuntu-24.04 }
          - { job: ubuntu-24.04-setup, runner: ubuntu-24.04 }
          - { job: ubuntu-26.04, runner: ubuntu-24.04 }
          - { job: debian-12, runner: ubuntu-24.04 }
          - { job: unit, runner: ubuntu-24.04 }
          - { job: fedora-latest, runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lima, for the VM jobs
        if: startsWith(matrix.job, 'ubuntu-') || startsWith(matrix.job, 'debian-') || startsWith(matrix.job, 'fedora-') || matrix.job == 'unit'
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils
          /home/linuxbrew/.linuxbrew/bin/brew install lima
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
          sudo chmod 666 /dev/kvm || true
      - run: scripts/sandbox-matrix.sh run ${{ matrix.job }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sandbox-matrix-${{ matrix.job }}
          path: reports/sandbox-matrix/${{ matrix.job }}

  macos:
    # On demand, or on a pull request labelled sandbox-matrix; adding another label does not re-run it.
    needs: pin
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (needs.pin.outputs.changed == 'true' && github.event.action != 'labeled') || (contains(github.event.pull_request.labels.*.name, 'sandbox-matrix') && (github.event.action != 'labeled' || github.event.label.name == 'sandbox-matrix'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - { job: macos-arm64, runner: macos-15 }
          - { job: macos-x64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/sandbox-matrix.sh run ${{ matrix.job }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sandbox-matrix-${{ matrix.job }}
          path: reports/sandbox-matrix/${{ matrix.job }}

  wsl2:
    # Tavi inside WSL2 on a Windows runner: the build, the unit tests and `tavi sandbox check`, whose
    # probe must find the Windows drives under /mnt unreadable. On demand until it proves reliable.
    needs: pin
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (needs.pin.outputs.changed == 'true' && github.event.action != 'labeled') || (contains(github.event.pull_request.labels.*.name, 'sandbox-matrix') && (github.event.action != 'labeled' || github.event.label.name == 'sandbox-matrix'))
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Ubuntu 24.04 in WSL2, with what the sandbox needs
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          wsl-conf: |
            [boot]
            systemd=true
          additional-packages: bubblewrap socat ripgrep python3 git curl xz-utils ca-certificates
      - name: An ordinary user, as a person runs Tavi
        shell: wsl-bash {0}
        run: useradd --create-home --shell /bin/bash tavi
      - name: Run later steps as that user
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-shell-user: tavi
      # The checkout is cloned onto the Linux filesystem: a data directory or node_modules on /mnt (9p) is
      # refused or slow, and a clone from git's objects has LF endings whatever the Windows checkout has.
      - name: Node, pnpm and a clone on the Linux filesystem
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          arch="$(uname -m)"; case "$arch" in x86_64) node=x64 ;; aarch64) node=arm64 ;; esac
          cd /tmp
          curl -fsSLO "https://nodejs.org/dist/v22.22.2/node-v22.22.2-linux-$node.tar.xz"
          curl -fsSLO https://nodejs.org/dist/v22.22.2/SHASUMS256.txt
          grep " node-v22.22.2-linux-$node.tar.xz\$" SHASUMS256.txt | sha256sum -c -
          mkdir -p ~/node && tar -C ~/node --strip-components=1 -xJf "node-v22.22.2-linux-$node.tar.xz"
          export PATH="$HOME/node/bin:$PATH"
          npm install --global --prefix ~/node pnpm@12.16.1
          workspace="$(wslpath -u '${{ github.workspace }}')"
          git config --global --add safe.directory "$workspace"
          git clone --quiet "file://$workspace" ~/tavi
      - name: Install and build
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          export PATH="$HOME/node/bin:$PATH"
          cd ~/tavi
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Unit tests
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          export PATH="$HOME/node/bin:$PATH"
          cd ~/tavi
          pnpm test
      - name: tavi sandbox check, the Windows drives unreadable inside
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          export PATH="$HOME/node/bin:$PATH"
          cd ~/tavi
          node apps/cli/dist/executable.mjs sandbox check --format json > ~/sandbox-check.json || { cat ~/sandbox-check.json; exit 1; }
          node -e '
            const section = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const drives = section.checks.find((check) => check.name === "Windows drives");
            if (drives === undefined || !drives.ok) { console.error(JSON.stringify(section, null, 2)); process.exit(1); }
            console.log("sandbox:", section.tier, "- /mnt/c unreadable inside the probe");
          ' ~/sandbox-check.json
