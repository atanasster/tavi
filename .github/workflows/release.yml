# A prebuilt Tavi for people who are not building it from source. A `v<version>` tag that matches
# apps/cli's version packs every package a `tavi` install needs (scripts/pack-release.mjs, the set
# the release gate installs), installs that release with scripts/install.sh on a fresh Linux and
# macOS runner, and only then publishes it as a GitHub Release with install.sh and SHA256SUMS
# attached. Run by hand (workflow_dispatch) it packs and test-installs without publishing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: version
        name: The CLI's version, which a tag must name
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./apps/cli/package.json").version')"
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$version" ]; then
            echo "the tag $REF_NAME does not match apps/cli's version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Release gate (the packed, installed CLI)
        run: pnpm run test:release
      - name: Pack the release
        run: node scripts/pack-release.mjs --no-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: release/${{ steps.version.outputs.version }}/
          if-no-files-found: error

  install:
    # The release as a person installs it: the attached install.sh, on a machine that never built Tavi.
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release
      - name: Install with install.sh
        env:
          TAVI_SKIP_CHROMIUM: "1"
        run: TAVI_RELEASE_BASE="$PWD/release" sh release/install.sh
      - name: The installed tavi runs
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/tavi-data"
          TAVI_DATA_DIR="$RUNNER_TEMP/tavi-data" "$HOME/.local/bin/tavi" --version | grep -F "$VERSION"

  publish:
    if: github.ref_type == 'tag'
    needs: [pack, install]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          gh release create "$TAG" --verify-tag --title "Tavi $VERSION" --notes-file release/RELEASE_NOTES.md \
            release/*.tgz release/install.sh release/SHA256SUMS
