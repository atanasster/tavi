name: Bug report
description: Something in Tavi does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: A security problem? Report it privately instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: The commands you ran, or what you did in the web canvas.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tavi --version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and Node.js version
      placeholder: macOS 15.4, Node 22.22.2
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: tavi doctor output
      description: Remove anything you would not share (connection names, paths).
      render: json
