# The VM jobs' cloud images. One line per image and
# architecture: <image> <arch> <url> <sha256>. A `-` digest is not yet pinned, and a job on it
# refuses to start; `scripts/sandbox-matrix.sh pin <image> <arch>` downloads it, records its
# digest here, and the change is reviewed like any other. A "latest" URL moves: re-pin it then.
ubuntu-24.04 aarch64 https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img -
ubuntu-24.04 x86_64  https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img -
ubuntu-26.04 aarch64 https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-arm64.img -
ubuntu-26.04 x86_64  https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-amd64.img -
debian-12    aarch64 https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-arm64.qcow2 -
debian-12    x86_64  https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2 -
